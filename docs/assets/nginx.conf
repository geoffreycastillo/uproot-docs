# Complete /etc/nginx/nginx.conf for an uproot server on Debian 13+.
# Requires nginx with HTTP/2 and HTTP/3 support.
# Assumes a Let's Encrypt certificate obtained with Certbot's standalone mode:
#   sudo certbot certonly --standalone -d example.com
# Stop nginx before obtaining it; see the VPS setup guide for renewal hooks.
# Allow inbound TCP ports 80 and 443, and UDP port 443 for HTTP/3.
#
# TODO: Replace every example.com below with your hostname.
# TODO: If Certbot used a different certificate name, adjust its paths below.
# After editing, back up /etc/nginx/nginx.conf and replace it with this file.
# Test with sudo nginx -t before starting or reloading nginx.
# No other nginx configuration files are included; this defines the whole site.

# TODO: If using another OS, adjust the worker user and system paths as needed.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    ssl_protocols TLSv1.2 TLSv1.3;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name example.com;  # TODO: Your hostname.
        return 301 https://$host$request_uri;
    }

    server {
        server_name example.com;  # TODO: Your hostname.

        listen 443 ssl;
        listen [::]:443 ssl;

        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;

        http2 on;
        http3 on;

        # nginx 1.26: repeat this header in any location with its own add_header.
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        # Certbot's default paths. TODO: Replace example.com with your hostname.
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        location / {
            # TODO: Change the address in BOTH proxy_pass lines if uproot
            # does not listen on 127.0.0.1:8000.
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 600s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Front-End-Https on;
            proxy_set_header X-Forwarded-Protocol https;
            proxy_set_header X-Forwarded-Ssl on;
            proxy_set_header X-Url-Scheme https;
            proxy_buffering off;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Do not log participant WebSockets (avoids log spam).
            location /ws/ {
                proxy_pass http://127.0.0.1:8000;
                access_log off;
            }
        }
    }
}
